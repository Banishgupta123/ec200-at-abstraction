name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-tests:
    name: Host tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcovr

      - name: Configure (coverage instrumented)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DEC200_COVERAGE=ON

      - name: Build
        run: cmake --build build

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

      # Line coverage is gated at 100%. The branch gate is 95% because GCC
      # versions count short-circuit branches differently; the reference
      # toolchain (GCC 16) holds 100% lines/functions/branches.
      - name: Coverage gate
        run: |
          gcovr --root . --filter src --print-summary \
                --fail-under-line 100 --fail-under-branch 95 build

  cppcheck:
    name: Static analysis (cppcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          cppcheck --enable=warning,style,performance,portability \
                   --std=c99 --language=c --inline-suppr \
                   --error-exitcode=1 \
                   --suppress=missingIncludeSystem \
                   --check-level=exhaustive \
                   -I include src

  analyzer:
    name: Static analysis (GCC -fanalyzer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build library with -fanalyzer
        run: |
          cmake -S . -B build-analyze -G Ninja \
                -DEC200_ANALYZER=ON -DEC200_BUILD_TESTS=OFF
          cmake --build build-analyze --target ec200

  esp-idf-component:
    name: ESP-IDF component build (${{ matrix.idf_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        idf_version: ["v5.2.2", "latest"]
    steps:
      - uses: actions/checkout@v4

      - name: Build example for esp32s3
        uses: espressif/esp-idf-ci-action@v1.2.0
        with:
          esp_idf_version: ${{ matrix.idf_version }}
          target: esp32s3
          path: examples/esp_idf
