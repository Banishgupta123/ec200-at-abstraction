version: "1.1.0"
description: >
  Platform-independent C99 AT-command abstraction for Quectel EC200U cellular
  modules: SIM, network, SMS, TCP/UDP, HTTP, MQTT, GNSS, and power management
  over three user-supplied UART callbacks. No RTOS or SoC dependencies.
